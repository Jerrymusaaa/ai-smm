services:
  # ── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: yoyzie-ai-api
    runtime: node
    plan: free
    autoDeploy: true
    branch: main
    rootDir: backend
    # logs/ is gitignored, so create it before winston opens its file transports
    buildCommand: npm install && mkdir -p logs && npm run db:generate && npm run build
    # Migrate on boot (idempotent) so the schema is always current before start
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /health
    envVars:
      # Pin Node: Render's default is a much newer major that ships a global
      # TypeScript which rejects options removed in TS7 (e.g. baseUrl).
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # NODE_ENV=production makes npm skip devDependencies, but the build needs
      # them (typescript/tsc, prisma CLI) — force them to install.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: OAUTH_CALLBACK_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: APP_NAME
        value: Yoyzie AI
      - key: AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_INITIATOR_NAME
        sync: false
      - key: MPESA_INITIATOR_PASSWORD
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_TYPE
        value: paybill
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "300"
